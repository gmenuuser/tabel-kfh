name: TabelKFH
options:
  bundleIdPrefix: ru.zubakhin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TabelKFH:
    type: application
    platform: iOS
    sources:
      - path: TabelKFH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zubakhin.tabelkfh
        PRODUCT_NAME: TabelKFH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Табель КФХ"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Фото сотрудника для карточки"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TabelKFHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TabelKFHTests
    dependencies:
      - target: TabelKFH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ru.zubakhin.tabelkfh.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TabelKFH.app/TabelKFH"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TabelKFH:
    build:
      targets:
        TabelKFH: all
        TabelKFHTests: [test]
    test:
      targets:
        - TabelKFHTests
      gatherCoverageData: false
