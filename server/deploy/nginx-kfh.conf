# https://kfh.cubely.ru -> the API container on 127.0.0.1:8090. certbot --nginx adds the certificate lines.
server {
    listen 80;
    listen [::]:80;
    server_name kfh.cubely.ru;

    # certbot --nginx rewrites this block; until then the site answers over plain http too
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    client_max_body_size 20m;

    # HSTS is sent once https is on (certbot --redirect makes port 80 redirect)
    add_header Strict-Transport-Security "max-age=31536000" always;
}
