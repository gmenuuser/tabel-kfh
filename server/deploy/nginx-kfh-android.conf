# https://kfh.cubely.ru/android/ - the Android app.
# deploy.sh installs this file as /etc/nginx/snippets/kfh-android.conf and includes it from the kfh.cubely.ru
# server block (nginx-kfh.conf has the include; an already certbot-edited site gets the line added by deploy.sh).
#   /android/                 the download page: web/public/android/index.html of the shipped sources (/opt/kfh)
#   /android/tabel-kfh.apk    the signed app, put there by deploy-android.sh (kept across deploy.sh updates)
#   /android/version.json     {"versionCode", "versionName", "url"} next to it; the app's «О приложении» reads it
# add_header is not inherited once a location sets its own, so HSTS is repeated here.
location = /android {
    return 301 /android/;
}

location = /android/tabel-kfh.apk {
    alias /opt/kfh/android/tabel-kfh.apk;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="TabelKFH.apk"';
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location = /android/version.json {
    alias /opt/kfh/android/version.json;
    types { }
    default_type application/json;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location /android/ {
    alias /opt/kfh/web/public/android/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# /ios/TabelKFH.ipa - the iPhone app file (installed from a computer with Sideloadly). Put there by hand:
#   ssh <host> 'mkdir -p /opt/kfh/ios && cat > /opt/kfh/ios/TabelKFH.ipa' < TabelKFH.ipa
# deploy.sh keeps it across updates.
location = /ios/TabelKFH.ipa {
    alias /opt/kfh/ios/TabelKFH.ipa;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="TabelKFH.ipa"';
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
