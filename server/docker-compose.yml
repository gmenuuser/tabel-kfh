# «КФХ — Учёт» server on this computer: PostgreSQL and the API.
#   docker compose up -d        start
#   docker compose logs -f api  log (reset codes are written here)
# Passwords come from .env (copy .env.example to .env and change them).
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kfh
      POSTGRES_USER: kfh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfh -d kfh"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kfh:${POSTGRES_PASSWORD}@db:5432/kfh
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - apidata:/data
    ports:
      - "8080:8080"

volumes:
  pgdata:
  apidata:
