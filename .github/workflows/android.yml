name: android

on:
  push:
    paths: ['android/**', 'shared/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Gradle (retries; services.gradle.org flakes)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "gradle download failed (try $i), waiting"; sleep 30
          done
          exit 1
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/tests
          if-no-files-found: ignore

  # The instrumented tests (the flows of Tasks 9–15, the walkthroughs and the small-screen check of Task 17, the
  # report samples) on two emulators: the oldest Android the app runs on (26) with the Galaxy Nexus profile — a
  # 360×640 dp screen and 1 GB — and a current one (35) on a Pixel. Each uploads its review samples (report PDFs,
  # XLSXs and page PNGs, every walkthrough screenshot); the «review-samples» job merges both for one download.
  emulator:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: google_apis
            arch: x86_64
            profile: Galaxy Nexus
            ram-size: 1024M
          - api-level: 35
            target: google_apis
            arch: x86_64
            profile: pixel_6
            ram-size: 2048M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Gradle (retries; services.gradle.org flakes)
        working-directory: android
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "gradle download failed (try $i), waiting"; sleep 30
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the apks before the emulator starts
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram-size }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          working-directory: android
          script: |
            # No «isn't responding» dialogs over the app (the launcher ANRs on a slow first boot); screen on.
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure show_first_crash_dialog 0 || true
            adb shell input keyevent 82 || true
            # The apks stay installed so the review samples can be pulled afterwards; shots=true makes the flow
            # tests of Tasks 9–15 keep their pictures too. The samples are pulled on the same line, before the
            # action stops the emulator, and also when the tests failed (the action runs each line as its own command).
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.shots=true; rc=$?; bash scripts/pull-review-samples.sh build/review-samples; exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-samples-api${{ matrix.api-level }}
          path: android/build/review-samples
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports-api${{ matrix.api-level }}
          path: |
            android/app/build/reports/androidTests/connected
            android/app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore

  review-samples:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: review-samples
          pattern: review-samples-api*
          separate-directories: true
          delete-merged: true

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      KFH_KEYSTORE_B64: ${{ secrets.KFH_KEYSTORE_B64 }}
      KFH_KEYSTORE_PASSWORD: ${{ secrets.KFH_KEYSTORE_PASSWORD }}
      KFH_KEY_ALIAS: ${{ secrets.KFH_KEY_ALIAS }}
      KFH_KEY_PASSWORD: ${{ secrets.KFH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Gradle (retries; services.gradle.org flakes)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "gradle download failed (try $i), waiting"; sleep 30
          done
          exit 1
      # Release signing: all four KFH_* secrets -> signed release (verified below); none -> debug apk, still green
      # (the owner adds the secrets later: docs/android-signing.md); some but not all -> stop and name the missing ones.
      - name: Signing secrets
        run: |
          missing=""
          for v in KFH_KEYSTORE_B64 KFH_KEYSTORE_PASSWORD KFH_KEY_ALIAS KFH_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            if ! echo "$KFH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kfh.jks"; then
              echo "::error::KFH_KEYSTORE_B64 is not valid base64 (paste the whole kfh-release.jks.b64.txt, see docs/android-signing.md)"
              exit 1
            fi
            echo "KFH_KEYSTORE_FILE=$RUNNER_TEMP/kfh.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "all four signing secrets are set: building the signed release"
          elif [ "$missing" = " KFH_KEYSTORE_B64 KFH_KEYSTORE_PASSWORD KFH_KEY_ALIAS KFH_KEY_PASSWORD" ]; then
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::no signing secrets (KFH_*): building the debug apk. Add them in Settings -> Secrets and variables -> Actions (docs/android-signing.md)"
          else
            echo "::error::signing secrets incomplete, missing:$missing. Add them in Settings -> Secrets and variables -> Actions (docs/android-signing.md), or remove all four to build unsigned"
            exit 1
          fi
      - name: Assemble
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDebug
          fi
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Verify the release signature (kfh key)
        if: env.SIGNED == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          got=$(sed -nE 's/^Signer #1 certificate SHA-256 digest: *([0-9a-f]+).*/\1/p' "$RUNNER_TEMP/certs.txt")
          want=f3ab556ccd7ef9013708a71e3a50aea21aa91acfe857f88826411f7cdcc16949
          if [ "$got" != "$want" ]; then
            echo "::error::app-release.apk is signed by another key ($got), not the kfh release key ($want): check KFH_KEYSTORE_B64 and KFH_KEY_ALIAS (docs/android-signing.md)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tabel-kfh-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
